name: macOS ARM
on:
  workflow_dispatch:
  workflow_call:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  build:
    # macos-latest is the Apple Silicon (arm64) runner. The sibling
    # macos-f64 workflow pins macos-15-intel (Intel x86_64); this one
    # exercises the aarch64 codegen path.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - run: cmake -B build -DALWAN_ENABLE_WARNINGS=ON -DALWAN_WARNINGS_AS_ERRORS=ON
      - run: cmake --build build --config Release
