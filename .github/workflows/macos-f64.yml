name: macOS
on:
  workflow_dispatch:
  workflow_call:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  build:
    # Pin to macos-15-intel (Intel x86_64). macos-latest is Apple Silicon
    # arm64: SIMD/precision paths haven't been validated there yet.
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v5
      - run: cmake -B build -DALWAN_ENABLE_WARNINGS=ON -DALWAN_WARNINGS_AS_ERRORS=ON
      - run: cmake --build build --config Release
