name: Linux ARM
# On-demand only: minutes on this private repo are billed. Run from the
# Actions tab, or through the umbrella 'CI' workflow, which calls them all.
on:
  workflow_dispatch:
  workflow_call:
jobs:
  build:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v5
      - run: cmake -B build -DALWAN_ENABLE_WARNINGS=ON -DALWAN_WARNINGS_AS_ERRORS=ON
      - run: cmake --build build --config Release
