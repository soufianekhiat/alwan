name: CI
# One button for the whole matrix. Nothing in this repo runs on push: its
# minutes are billed, so a full check is started by hand from the Actions tab.
# Each workflow below can also be dispatched on its own.
on:
  workflow_dispatch:
jobs:
  linux:
    uses: ./.github/workflows/linux-f64.yml
  linux-arm:
    uses: ./.github/workflows/linux-arm-f64.yml
  windows:
    uses: ./.github/workflows/windows-f64.yml
  windows-arm:
    uses: ./.github/workflows/windows-arm-f64.yml
  macos:
    uses: ./.github/workflows/macos-f64.yml
  macos-arm:
    uses: ./.github/workflows/macos-arm-f64.yml
  precision:
    uses: ./.github/workflows/precision-builds.yml
  permutation:
    uses: ./.github/workflows/permutation-builds.yml
